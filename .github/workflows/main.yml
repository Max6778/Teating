name: Roblox Studio Artifact

on:
  workflow_dispatch:

jobs:
  grab-studio:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Get latest Studio version
        shell: pwsh
        run: |
          $guid = (Invoke-RestMethod "https://setup.rbxcdn.com/versionStudio").ToString().Trim()
          Write-Host "Latest Studio version: $guid"
          "STUDIO_GUID=$guid" >> $env:GITHUB_ENV

      - name: Download and assemble Studio from the CDN
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $guid = $env:STUDIO_GUID
          $base = "https://setup.rbxcdn.com"
          $verDir = Join-Path $env:LOCALAPPDATA "Roblox\Versions\$guid"
          $tmp = Join-Path $env:RUNNER_TEMP "pkgs"
          New-Item -ItemType Directory -Force $verDir, $tmp | Out-Null

          # 1) Known folders (from Vinegar's Studio map)
          $map = @{
            "BuiltInPlugins.zip"="BuiltInPlugins"
            "ApplicationConfig.zip"="ApplicationConfig"
            "BuiltInStandalonePlugins.zip"="BuiltInStandalonePlugins"
            "content-qt_translations.zip"="content/qt_translations"
            "content-platform-fonts.zip"="PlatformContent/pc/fonts"
            "content-terrain.zip"="PlatformContent/pc/terrain"
            "content-textures3.zip"="PlatformContent/pc/textures"
            "extracontent-translations.zip"="ExtraContent/translations"
            "extracontent-luapackages.zip"="ExtraContent/LuaPackages"
            "extracontent-textures.zip"="ExtraContent/textures"
            "extracontent-scripts.zip"="ExtraContent/scripts"
            "extracontent-models.zip"="ExtraContent/models"
            "content-sky.zip"="content/sky"
            "content-fonts.zip"="content/fonts"
            "content-avatar.zip"="content/avatar"
            "content-models.zip"="content/models"
            "content-sounds.zip"="content/sounds"
            "content-configs.zip"="content/configs"
            "content-api-docs.zip"="content/api_docs"
            "content-textures2.zip"="content/textures"
            "content-studio_svg_textures.zip"="content/studio_svg_textures"
            "Qml.zip"="Qml"
            "ssl.zip"="ssl"
            "Plugins.zip"="Plugins"
            "shaders.zip"="shaders"
            "StudioFonts.zip"="StudioFonts"
            "redist.zip"=""
            "WebView2.zip"=""
            "Libraries.zip"=""
            "LibrariesQt5.zip"=""
            "RobloxStudio.zip"=""
            "WebView2RuntimeInstaller.zip"=""
          }

          # 2) Fill gaps from the Mod Manager's live KnownRoots.json (never overrides step 1)
          $script:added = @()
          function Walk($o) {
            if ($o -is [System.Management.Automation.PSCustomObject]) {
              foreach ($p in $o.PSObject.Properties) {
                if ($p.Name -like "*.zip" -and $p.Value -is [string]) {
                  if (-not $map.ContainsKey($p.Name)) { $map[$p.Name] = $p.Value; $script:added += $p.Name }
                } else { Walk $p.Value }
              }
            } elseif ($o -is [System.Collections.IEnumerable] -and $o -isnot [string]) {
              foreach ($x in $o) { Walk $x }
            }
          }
          try {
            $rootsUrl = "https://raw.githubusercontent.com/MaximumADHD/Roblox-Studio-Mod-Manager/main/Config/KnownRoots.json"
            Invoke-WebRequest -UseBasicParsing $rootsUrl -OutFile "$tmp\KnownRoots.json"
            $raw = Get-Content "$tmp\KnownRoots.json" -Raw
            Write-Host "KnownRoots.json starts with:"
            Write-Host $raw.Substring(0, [Math]::Min(1200, $raw.Length))
            Walk ($raw | ConvertFrom-Json)
            Write-Host "Added from remote map: $($script:added -join ', ')"
          } catch { Write-Host "::warning::Could not use remote KnownRoots.json: $($_.Exception.Message)" }

          # 3) Last resort: guesses from naming pattern (flagged in the log)
          $guess = @{
            "RibbonConfig.zip"="RibbonConfig"
            "content-platform-dictionaries.zip"="PlatformContent/pc/dictionaries"
            "studiocontent-models.zip"="StudioContent/models"
            "studiocontent-textures.zip"="StudioContent/textures"
          }
          $guessed = @()
          foreach ($k in $guess.Keys) {
            if (-not $map.ContainsKey($k)) { $map[$k] = $guess[$k]; $guessed += $k }
          }

          # 4) Download, verify, extract
          Invoke-WebRequest -UseBasicParsing "$base/$guid-rbxPkgManifest.txt" -OutFile "$tmp\manifest.txt"
          $lines = @(Get-Content "$tmp\manifest.txt" | Where-Object { $_.Trim() -ne "" })
          if ($lines[0] -match '^v\d+$') { $lines = $lines[1..($lines.Count - 1)] }
          $total = [int]($lines.Count / 4)
          Write-Host "Packages in manifest: $total"

          $unmapped = @()
          for ($i = 0; $i -lt $lines.Count; $i += 4) {
            $name = $lines[$i].Trim()
            $md5 = $lines[$i + 1].Trim()
            $n = [int]($i / 4) + 1
            $zip = Join-Path $tmp $name

            $ok = $false
            for ($try = 1; $try -le 3 -and -not $ok; $try++) {
              Invoke-WebRequest -UseBasicParsing "$base/$guid-$name" -OutFile $zip
              $ok = ((Get-FileHash $zip -Algorithm MD5).Hash -ieq $md5)
              if (-not $ok) { Write-Host "  checksum mismatch on $name, retry $try" }
            }
            if (-not $ok) { throw "Bad checksum: $name" }

            if ($map.ContainsKey($name)) {
              $dest = Join-Path $verDir $map[$name]
              New-Item -ItemType Directory -Force $dest | Out-Null
              tar -xf $zip -C $dest
              if ($LASTEXITCODE -ne 0) { Expand-Archive $zip $dest -Force }
              Remove-Item $zip
              $tag = ""; if ($guessed -contains $name) { $tag = "  (GUESSED folder: $($map[$name]))" }
              Write-Host "[$n/$total] $name$tag"
            } else {
              $unmapped += $name
              New-Item -ItemType Directory -Force "$verDir\_unmapped" | Out-Null
              Move-Item $zip "$verDir\_unmapped\"
              Write-Host "[$n/$total] $name  (UNMAPPED, kept as zip)"
            }
          }

          @'
          <Settings>
             <ContentFolder>content</ContentFolder>
             <BaseUrl>http://www.roblox.com</BaseUrl>
          </Settings>
          '@ | Set-Content "$verDir\AppSettings.xml" -Encoding utf8

          if ($unmapped.Count -gt 0) { Write-Host "::warning::Unmapped packages: $($unmapped -join ', ')" }
          if (-not (Test-Path "$verDir\RobloxStudioBeta.exe")) { throw "RobloxStudioBeta.exe missing after assembly" }
          $files = Get-ChildItem $verDir -Recurse -File
          Write-Host "Assembled $($files.Count) files, $([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB)) MB"
          "VER_DIR=$verDir" >> $env:GITHUB_ENV

      - name: Launch Studio and wait for sign-in window
        shell: pwsh
        run: |
          Start-Process "$env:VER_DIR\RobloxStudioBeta.exe" -WorkingDirectory $env:VER_DIR

          $ready = $false
          for ($i = 0; $i -lt 36; $i++) {
            Start-Sleep -Seconds 5
            $p = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue |
                 Where-Object { $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -ne "" }
            if ($p) { Write-Host "Window: $($p.MainWindowTitle)"; $ready = $true; break }
          }
          if ($ready) { Start-Sleep -Seconds 30 }
          else { Write-Host "::warning::No Studio window detected in 3 min" }

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("signin.png")

          Get-Process RobloxStudio*, RobloxPlayer* -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5

      - name: Copy the entire Roblox folder
        shell: pwsh
        run: |
          robocopy "$env:LOCALAPPDATA\Roblox" "RobloxStudio" /E /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
          $files = Get-ChildItem RobloxStudio -Recurse -File
          Write-Host "Copied $($files.Count) files, $([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB)) MB"
          exit 0

      - name: Upload Studio folder
        uses: actions/upload-artifact@v4
        with:
          name: RobloxStudio
          path: RobloxStudio

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signin-screenshot
          path: signin.png
          if-no-files-found: ignore
