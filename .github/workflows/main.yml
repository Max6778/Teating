name: Roblox Studio Artifact

on:
  workflow_dispatch:

jobs:
  grab-studio:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download installer
        shell: pwsh
        run: |
          Invoke-WebRequest "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe" -OutFile installer.exe
          $guid = (Invoke-RestMethod "https://setup.rbxcdn.com/versionStudio").ToString().Trim()
          Write-Host "Latest Studio version: $guid"
          "STUDIO_GUID=$guid" >> $env:GITHUB_ENV

      - name: Install and wait for sign-in screen
        shell: pwsh
        run: |
          $roots = @("$env:LOCALAPPDATA\Roblox", "${env:ProgramFiles(x86)}\Roblox")

          function Find-Exe {
            foreach ($r in $roots) {
              $p = Join-Path $r "Versions\$env:STUDIO_GUID\RobloxStudioBeta.exe"
              if (Test-Path $p) { return Get-Item $p }
            }
            foreach ($r in $roots) {
              $f = Get-ChildItem "$r\Versions\version-*\RobloxStudioBeta.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($f) { return $f }
            }
          }

          Start-Process .\installer.exe

          $exe = $null
          for ($i = 0; $i -lt 240; $i++) {
            $exe = Find-Exe
            if ($exe) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $exe) { throw "Studio exe never appeared" }
          $verDir = $exe.DirectoryName
          Write-Host "Found: $($exe.FullName)"

          # wait until the install folder stops growing
          $last = -1; $same = 0
          while ($same -lt 4) {
            Start-Sleep -Seconds 10
            $size = (Get-ChildItem $verDir -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            if ($size -eq $last) { $same++ } else { $same = 0; $last = $size }
          }

          if (-not (Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue)) {
            Start-Process $exe.FullName
          }

          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {
            $p = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue |
                 Where-Object { $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -ne "" }
            if ($p) { Write-Host "Window: $($p.MainWindowTitle)"; $ready = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $ready) { throw "Sign-in screen never appeared" }
          Start-Sleep -Seconds 30

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("signin.png")

          Get-Process RobloxStudio*, RobloxPlayer* -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5

      - name: Copy the entire Roblox folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path RobloxStudio | Out-Null

          if (Test-Path "$env:LOCALAPPDATA\Roblox") {
            robocopy "$env:LOCALAPPDATA\Roblox" "RobloxStudio\Roblox_LocalAppData" /E /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
          }
          if (Test-Path "${env:ProgramFiles(x86)}\Roblox") {
            robocopy "${env:ProgramFiles(x86)}\Roblox" "RobloxStudio\Roblox_ProgramFiles" /E /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
          }

          $files = Get-ChildItem RobloxStudio -Recurse -File
          $mb = [math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "Copied $($files.Count) files, $mb MB"
          if ($files.Count -lt 100) { throw "Copy looks too small" }
          Get-ChildItem RobloxStudio -Recurse -Filter RobloxStudioBeta.exe | ForEach-Object { Write-Host $_.FullName }

          exit 0

      - name: Upload Studio folder
        uses: actions/upload-artifact@v4
        with:
          name: RobloxStudio
          path: RobloxStudio

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signin-screenshot
          path: signin.png
          if-no-files-found: ignore
